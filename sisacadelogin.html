<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema Académico</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="body-login">

  <main class="left-panel">
    <h1 class="title">Sistema académico</h1>

    <div class="login-wrapper">
      <section class="login-card">
        <h2>Iniciar Sesión</h2>

        <form class="login-form" action="sisacade.html">
          <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
          </div>

          <div class="form-actions">
            <a href="#recuperar" class="recover-link">¿Olvidaste tu contraseña? Recuperar cuenta</a>
          </div>

          <button type="submit" class="login-btn">Ingresar</button>
        </form>
      </section>
    </div>

    <nav class="back-container" aria-label="Navegación Secundaria">
      <a href="index.html" class="back-btn">Volver a la página principal</a>
    </nav>

  </main>

  <aside class="right-panel" aria-label="Video decorativo de fondo">
    <figure class="image-wrapper">
      <video src="Comp 1.mp4" autoplay loop muted playsinline></video>
    </figure>
  </aside>

</body>

</html>
